<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - BIJST</title>
  <style>
    :root {
      --blue: #0066FF;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #1a1a1a;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: var(--card);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h2 {
      margin-top: 0;
      color: var(--text);
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }
    .input-group input:focus {
      border-color: var(--blue);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0052cc;
    }
    #error-msg {
      color: red;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>BIJST Admin Portal</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <div id="error-msg"></div>
    </form>
  </div>
  <script>
    if (localStorage.getItem('bijst_admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        });
        
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('bijst_admin_token', data.token);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.msg || 'Login failed';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Server error';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
