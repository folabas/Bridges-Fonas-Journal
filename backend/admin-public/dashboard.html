<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BIJST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --blue: #0066FF;
      --blue-dark: #0052cc;
      --bg: #f4f7fe;
      --card: #FFFFFF;
      --text: #2b3674;
      --text-muted: #a3aed1;
      --danger: #ee5d50;
      --danger-hover: #d14438;
      --border: #e0e5f2;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* Top Navbar */
    .header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 5%;
      width: 100%;
      flex: 1;
    }
    .card {
      background: var(--card);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(112, 144, 176, 0.12);
      margin-bottom: 32px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .card-header h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    /* Form Grid */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input, .input-group select, .input-group textarea {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      background: #fcfcfc;
      transition: all 0.2s;
    }
    .input-group input:focus, .input-group textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
      background: #fff;
    }
    .input-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    /* File input styling */
    .file-upload-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .file-upload-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
    }
    .btn-upload-ui {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 102, 255, 0.05);
      border: 2px dashed var(--blue);
      color: var(--blue);
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .file-upload-wrapper:hover .btn-upload-ui {
      background: rgba(0, 102, 255, 0.1);
    }
    /* Buttons */
    .btn {
      padding: 12px 24px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
    }
    .btn-danger {
      background: rgba(238, 93, 80, 0.1);
      color: var(--danger);
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 4px 12px rgba(238, 93, 80, 0.2);
    }
    .btn-secondary {
      background: #f4f7fe;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #e0e5f2;
      box-shadow: none;
    }
    /* Table Responsive */
    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      background: #fcfcfc;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .thumbnail {
      width: 48px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .article-title-cell {
      font-weight: 600;
      max-width: 250px;
    }
    .article-title-cell div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #loading {
      display: none;
      color: var(--blue);
      font-weight: 600;
      margin-top: 16px;
      text-align: center;
    }
    #fileNameDisplay {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .header {
        padding: 16px;
      }
      .card {
        padding: 20px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2><i class="fa-solid fa-layer-group" style="color: var(--blue);"></i> BIJST Admin</h2>
    <button class="btn btn-secondary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
  <div class="container">
    
    <div class="card">
      <div class="card-header">
        <h3><i class="fa-solid fa-cloud-arrow-up" style="color: var(--blue); margin-right: 8px;"></i> Upload New Article</h3>
      </div>
      <form id="uploadForm">
        <div class="form-grid">
          <div class="input-group">
            <label>Article Title</label>
            <input type="text" id="title" placeholder="E.g. AI in Agriculture" required>
          </div>
          <div class="input-group">
            <label>Authors (comma separated)</label>
            <input type="text" id="authors" placeholder="John Doe, Jane Smith" required>
          </div>
          <div class="input-group">
            <label>Category</label>
            <input type="text" id="category" placeholder="E.g. Computer Science" required>
          </div>
          <div class="input-group">
            <label>Publication Year</label>
            <input type="number" id="year" required value="2026">
          </div>
          <div class="input-group">
            <label>Volume</label>
            <input type="text" id="volume" placeholder="1">
          </div>
          <div class="input-group">
            <label>Issue</label>
            <input type="text" id="issue" placeholder="1">
          </div>
          <div class="input-group">
            <label>Pages</label>
            <input type="text" id="pages" placeholder="10-25">
          </div>
          <div class="input-group">
            <label>Keywords</label>
            <input type="text" id="keywords" placeholder="AI, Machine Learning, Farming">
          </div>
        </div>
        <div class="input-group" style="margin-bottom: 24px;">
          <label>Abstract</label>
          <textarea id="abstract" placeholder="Brief summary of the research..." required></textarea>
        </div>
        <div class="input-group" style="margin-bottom: 32px;">
          <label>PDF Document</label>
          <div class="file-upload-wrapper">
            <div class="btn-upload-ui">
              <i class="fa-solid fa-file-pdf"></i> Select PDF File
            </div>
            <input type="file" id="pdfFile" accept="application/pdf" required>
          </div>
          <div id="fileNameDisplay"></div>
        </div>
        <button type="submit" class="btn"><i class="fa-solid fa-upload"></i> Publish Article</button>
        <div id="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Uploading and generating thumbnail... please wait.</div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">
        <h3><i class="fa-solid fa-book-open" style="color: var(--blue); margin-right: 8px;"></i> Manage Archive</h3>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Cover</th>
              <th>Title</th>
              <th>Authors</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="articlesTableBody">
            <tr>
              <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('bijst_admin_token');
    if (!token) {
      window.location.href = '/admin/';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('bijst_admin_token');
      window.location.href = '/admin/';
    });

    // File input display name
    document.getElementById('pdfFile').addEventListener('change', function(e) {
      const fileName = e.target.files[0]?.name;
      if (fileName) {
        document.getElementById('fileNameDisplay').innerHTML = `Selected: <strong>${fileName}</strong>`;
      }
    });

    async function loadArticles() {
      try {
        const res = await fetch('/api/articles?limit=50');
        const data = await res.json();
        const tbody = document.getElementById('articlesTableBody');
        tbody.innerHTML = '';
        
        if (data.articles.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No articles found in database.</td></tr>`;
          return;
        }

        data.articles.forEach(article => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${article.thumbnailUrl ? `<img src="${article.thumbnailUrl}" class="thumbnail">` : '<div class="thumbnail" style="background:#eee;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-file-pdf" style="color:#aaa;"></i></div>'}</td>
            <td class="article-title-cell"><div>${article.title}</div></td>
            <td><div style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${article.authors.join(', ')}</div></td>
            <td><span style="background: var(--bg); padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 600;">${article.category}</span></td>
            <td>
              <button class="btn btn-danger" onclick="deleteArticle('${article._id}')"><i class="fa-solid fa-trash"></i> Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        document.getElementById('articlesTableBody').innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--danger);">Failed to load articles. Server Error.</td></tr>`;
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('authors', document.getElementById('authors').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('year', document.getElementById('year').value);
      formData.append('volume', document.getElementById('volume').value);
      formData.append('issue', document.getElementById('issue').value);
      formData.append('pages', document.getElementById('pages').value);
      formData.append('keywords', document.getElementById('keywords').value);
      formData.append('abstract', document.getElementById('abstract').value);
      formData.append('pdf', document.getElementById('pdfFile').files[0]);

      try {
        const res = await fetch('/api/admin/articles', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        if (res.ok) {
          alert('Article uploaded successfully!');
          document.getElementById('uploadForm').reset();
          document.getElementById('fileNameDisplay').innerHTML = '';
          loadArticles();
        } else {
          const data = await res.json();
          alert('Upload Failed: ' + (data.msg || 'Server Error'));
        }
      } catch (err) {
        alert('Upload Failed: Could not connect to the server.');
      } finally {
        loadingEl.style.display = 'none';
      }
    });

    window.deleteArticle = async function(id) {
      if (confirm('Are you sure you want to completely delete this article?')) {
        try {
          const res = await fetch(`/api/admin/articles/${id}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          if (res.ok) {
            loadArticles();
          } else {
            const data = await res.json();
            alert('Delete Failed: ' + (data.msg || 'Server Error'));
          }
        } catch (err) {
          alert('Delete Failed: Could not connect to the server.');
        }
      }
    }

    loadArticles();
  </script>
</body>
</html>
